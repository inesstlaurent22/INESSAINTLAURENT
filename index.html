<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">

  <!-- ================= SEO ================= -->
  <title>KIT IN – Portfolio | Stratégie, Business & Digital</title>
  <meta name="description"
        content="Consultante en développement d’activité, stratégie commerciale et marketing international. Portfolio professionnel de Inès Saint Laurent.">
  <meta name="author" content="Inès Saint Laurent">
  <meta name="robots" content="index, follow">

<!-- Open Graph – Instagram / Facebook / WhatsApp / LinkedIn / TikTok -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://inesstlaurent22.github.io/PortefolioInes/">
<meta property="og:title" content="Inès Saint Laurent – Portfolio digital">
<meta property="og:description" content="Portfolio digital – communication, branding, design & projets créatifs.">
<meta property="og:image" content="https://inesstlaurent22.github.io/PortefolioInes/Banniereportefolio.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://inesstlaurent22.github.io/PortefolioInes/">
<meta name="twitter:title" content="Inès Saint Laurent – Portfolio digital">
<meta name="twitter:description" content="Portfolio digital – communication, branding, design & projets créatifs.">
<meta name="twitter:image" content="https://inesstlaurent22.github.io/PortefolioInes/Banniereportefolio.jpg?v=2">

  <!-- ================= RESPONSIVE ================= -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ================= PERFORMANCE ================= -->
  <link rel="preload" as="image" href="images/Portefolioin.png">

  <!-- ================= CSS ================= -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= CONTENEUR PRINCIPAL ================= -->
  <main class="FondPortefolio" role="main">

    <!-- Image de fond -->
    <img
      src="images/Portefolioin.png"
      class="fondindex"
      alt="Portfolio de Inès Saint Laurent – Stratégie, business et digital"
      loading="eager"
      decoding="async"
    >

        <!-- ================= WIDGET FORMATION  ================= -->

<a href="https://inesstlaurent22.github.io/FORMATION-ENTREPRO/" 
   class="formation-widget" 
   id="formationWidget">

  <span class="widget-text" id="formationWidgetText">
    ⏳🎉 Prochainement, retrouvez ma formation en création d’entreprise.
    Cliquez ici pour y accéder.
  </span>

</a>

    <!-- ================= CHATBOT ================= -->

<div id="chatbot-container">

  <!-- Bouton -->
  <button id="chatbot-toggle">💬</button>

  <!-- Fenêtre -->
  <div id="chatbot-box">
    <div id="chatbot-header">Assistant IA</div>

    <div id="chatbot-messages"></div>

    <div id="chatbot-input-area">
      <input type="text" id="chatbot-input" placeholder="Pose ta question..." />
      <button id="chatbot-send">➤</button>
    </div>
  </div>

</div>

    <!-- ================= BLOCS INTERACTIFS ================= -->

    <!-- PRÉSENTATION -->
    <button
      class="bloc bleu1"
      data-key="presentation"
      data-color="#3A6EFF"
      aria-label="Présentation"
      type="button">
      <img src="images/Bleu1.png" alt="" loading="lazy">
      <span class="label">PRÉSENTATION</span>
    </button>

    <!-- MON OFFRE -->
    <button
      class="bloc rose1"
      data-key="offre"
      data-color="#FF4FD8"
      aria-label="Mon offre"
      type="button">
      <img src="images/Rose1.png" alt="" loading="lazy">
      <span class="label">MON OFFRE</span>
    </button>

    <!-- PARCOURS PROFESSIONNEL -->
    <button
      class="bloc violet1"
      data-key="experience"
      data-color="#7C4DFF"
      aria-label="Parcours professionnel"
      type="button">
      <img src="images/Violet1.png" alt="" loading="lazy">
      <span class="label">PARCOURS PROFESSIONNEL</span>
    </button>

    <!-- LOGICIELS & COMPÉTENCES -->
    <button
      class="bloc violet2"
      data-key="tools"
      data-color="#9C6BFF"
      aria-label="Logiciels et compétences"
      type="button">
      <img src="images/Violet2.png" alt="" loading="lazy">
      <span class="label">LOGICIELS & COMPÉTENCES</span>
    </button>

    <!-- PARCOURS ACADÉMIQUE -->
    <button
      class="bloc orange1"
      data-key="academic"
      data-color="#FF8A00"
      aria-label="Parcours académique"
      type="button">
      <img src="images/Orange1.png" alt="" loading="lazy">
      <span class="label">PARCOURS ACADÉMIQUE</span>
    </button>

    <!-- RÉSEAUX SOCIAUX -->
    <button
      class="bloc jaune1"
      data-key="socials"
      data-color="#FFD400"
      aria-label="Réseaux sociaux"
      type="button">
      <img src="images/Jaune1.png" alt="" loading="lazy">
      <span class="label">RÉSEAUX SOCIAUX</span>
    </button>

  </main>

  <!-- ================= OVERLAY ================= -->
  <div
    id="overlay"
    aria-hidden="true"
    role="dialog"
    aria-modal="true">
    <div id="colorBox">
      <div id="contentBox" role="document"></div>
    </div>
  </div>

  <!-- ================= LANGUAGE SWITCH ================= -->
  <div id="lang-switch" aria-label="Sélecteur de langue">
    <button
      id="lang-current"
      type="button"
      aria-haspopup="true"
      aria-expanded="false"
      aria-label="Changer la langue">
      🌐
    </button>

    <div id="lang-menu" class="lang-menu">
      <button role="menuitem" data-lang="fr">🇫🇷 Français</button>
      <button role="menuitem" data-lang="en">🇬🇧 English</button>
      <button role="menuitem" data-lang="es">🇪🇸 Español</button>
      <button role="menuitem" data-lang="zh">🇨🇳 中文</button>
    </div>
  </div>

  <!-- ================= FALLBACK ================= -->
  <noscript>
    <p style="color:white; text-align:center; padding:24px;">
      Ce portfolio interactif nécessite JavaScript pour fonctionner correctement.
    </p>
  </noscript>

  <!-- ================= JS ================= -->
  <script src="script.js" defer></script>
  <script src="agentia.js" defer></script>

</body>
</html>
